<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Cancellation Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #183b65;
        }
        p {
            text-align: center;
            color: #666;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover {
            background: #104d80;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Hotel Booking Cancellation Prediction</h1>
    <p>Enter booking details to predict cancellation.</p>
    <form id="bookingForm">
        <div class="form-grid">
            <div>
                <label>Hotel</label>
                <select name="hotel" required>
                    <option value="Resort Hotel">Resort Hotel</option>
                    <option value="City Hotel">City Hotel</option>
                </select>
            </div>
            <div>
                <label>Lead Time</label>
                <input type="number" name="lead_time" min="0" value="50" required>
            </div>
            <div>
                <label>Arrival Year</label>
                <input type="number" name="arrival_date_year" value="2017" required>
            </div>
            <div>
                <label>Arrival Month</label>
                <select name="arrival_date_month">
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>
            </div>
            <div>
                <label>Arrival Week Number</label>
                <input type="number" name="arrival_date_week_number" value="25" required>
            </div>
            <div>
                <label>Arrival Day</label>
                <input type="number" name="arrival_date_day_of_month" min="1" max="31" value="15" required>
            </div>
            <div>
                <label>Weekend Nights</label>
                <input type="number" name="stays_in_weekend_nights" min="0" value="2" required>
            </div>
            <div>
                <label>Week Nights</label>
                <input type="number" name="stays_in_week_nights" min="0" value="3" required>
            </div>
            <div>
                <label>Adults</label>
                <input type="number" name="adults" min="0" value="2" required>
            </div>
            <div>
                <label>Children</label>
                <input type="number" name="children" min="0" step="any" value="0">
            </div>
            <div>
                <label>Babies</label>
                <input type="number" name="babies" min="0" value="0">
            </div>
            <div>
                <label>Meal</label>
                <select name="meal">
                    <option value="BB">BB</option>
                    <option value="HB">HB</option>
                    <option value="FB">FB</option>
                    <option value="SC">SC</option>
                    <option value="Undefined">Undefined</option>
                </select>
            </div>
            <div>
                <label>Country</label>
                <input type="text" name="country" value="PRT" required>
            </div>
            <div>
                <label>Market Segment</label>
                <select name="market_segment">
                    <option>Online TA</option>
                    <option>Offline TA/TO</option>
                    <option>Direct</option>
                    <option>Groups</option>
                    <option>Corporate</option>
                    <option>Complementary</option>
                    <option>Aviation</option>
                    <option>Undefined</option>
                </select>
            </div>
            <div>
                <label>Distribution Channel</label>
                <select name="distribution_channel">
                    <option>TA/TO</option>
                    <option>Direct</option>
                    <option>Corporate</option>
                    <option>GDS</option>
                    <option>Undefined</option>
                </select>
            </div>
            <div>
                <label>Repeated Guest (0/1)</label>
                <input type="number" name="is_repeated_guest" min="0" max="1" value="0" required>
            </div>
            <div>
                <label>Previous Cancellations</label>
                <input type="number" name="previous_cancellations" min="0" value="0" required>
            </div>
            <div>
                <label>Previous Bookings Not Cancelled</label>
                <input type="number" name="previous_bookings_not_canceled" min="0" value="0" required>
            </div>
            <div>
                <label>Reserved Room Type</label>
                <input type="text" name="reserved_room_type" value="A" required>
            </div>
            <div>
                <label>Deposit Type</label>
                <select name="deposit_type">
                    <option>No Deposit</option>
                    <option>Non Refund</option>
                    <option>Refundable</option>
                </select>
            </div>
            <div>
                <label>Agent ID</label>
                <input type="number" name="agent" min="0" step="any" value="0">
            </div>
            <div>
                <label>Customer Type</label>
                <select name="customer_type">
                    <option>Transient</option>
                    <option>Transient-Party</option>
                    <option>Contract</option>
                    <option>Group</option>
                </select>
            </div>
            <div>
                <label>ADR</label>
                <input type="number" name="adr" step="any" value="100" required>
            </div>
            <div>
                <label>Required Car Parking Spaces</label>
                <input type="number" name="required_car_parking_spaces" min="0" value="0" required>
            </div>
            <div>
                <label>Total Special Requests</label>
                <input type="number" name="total_of_special_requests" min="0" value="1" required>
            </div>
        </div>
        <button type="submit" id="predictButton">Predict Booking Status</button>
    </form>
    <div id="result"></div>
</div>
<script>
    const form = document.getElementById("bookingForm");
    const result = document.getElementById("result");
    const button = document.getElementById("predictButton");
    form.addEventListener("submit", async function(event) {
        event.preventDefault();
        const formData = new FormData(form);
        const bookingData = {};
        for (const [key, value] of formData.entries()) {
            bookingData[key] = value;
        }
        const integerFields = [
            "lead_time",
            "arrival_date_year",
            "arrival_date_week_number",
            "arrival_date_day_of_month",
            "stays_in_weekend_nights",
            "stays_in_week_nights",
            "adults",
            "babies",
            "is_repeated_guest",
            "previous_cancellations",
            "previous_bookings_not_canceled",
            "required_car_parking_spaces",
            "total_of_special_requests"
        ];
        integerFields.forEach(key => {
            bookingData[key] = Number(bookingData[key]);
        });
        ["children", "agent", "adr"].forEach(key => {
            bookingData[key] = Number(bookingData[key]);
        });
        button.disabled = true;
        button.textContent = "Predicting...";
        result.style.display = "block";
        result.textContent = "Please wait...";
        result.style.background = "#eeeeee";
        try {
            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bookingData)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(JSON.stringify(data.detail || data));
            }
            result.style.background =
                data.is_canceled === 1 ? "#ffe2e2" : "#dcfce7";
            result.innerHTML = `
                <h3>${data.prediction}</h3>
                <p>Cancellation Probability: ${data.cancellation_probability}%</p>
                <p>${data.message}</p>
            `;
        } catch (error) {
            result.style.background = "#ffe2e2";
            result.textContent = "Error: " + error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Predict Booking Status";
        }
    });
</script>
</body>
</html>
